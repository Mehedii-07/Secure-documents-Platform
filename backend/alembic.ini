# ============================================================
# Alembic Configuration
# ============================================================
# This file is used by `alembic` CLI.
# The DATABASE_URL is read from app.core.config at runtime,
# NOT hardcoded here. See alembic/env.py.
# ============================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path configuration
prepend_sys_path = .

# Timezone for migration timestamps
timezone = UTC

[post_write_hooks]
# Run ruff formatter on generated migration files
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
