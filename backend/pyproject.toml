[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "compliance-platform-backend"
version = "0.1.0"
description = "AI-Powered Secure Document & Compliance Platform — Backend"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Platform Team" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ============================================================
# Ruff — linter + formatter
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 100
extend-select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
]
ignore = [
    "S101",  # Allow assert in tests
    "B008",  # Allow function calls in argument defaults (FastAPI Depends)
    "B904",  # Allow raise without from in exception handlers
]
exclude = [
    ".venv",
    "alembic/versions",
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "N"]

[tool.ruff.isort]
known-first-party = ["app"]

# ============================================================
# Mypy — static type checking
# ============================================================
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: fast unit tests with no external dependencies",
    "integration: tests that require database or external services",
    "slow: tests that are slow (deselect with '-m not slow')",
]

# ============================================================
# Coverage
# ============================================================
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*", "app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
