name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # Backend — Lint
  # ============================================================
  backend-lint:
    name: "Backend — Lint (ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install linting tools
        run: pip install ruff==0.5.0

      - name: Run ruff check
        run: ruff check app/ tests/

      - name: Run ruff format check
        run: ruff format --check app/ tests/

  # ============================================================
  # Backend — Type Check
  # ============================================================
  backend-typecheck:
    name: "Backend — Type Check (mypy)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Run mypy
        run: mypy app/
        continue-on-error: true   # Non-blocking until type coverage improves

  # ============================================================
  # Backend — Tests
  # ============================================================
  backend-test:
    name: "Backend — Tests (pytest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Provide environment variables required by Settings
    # These are test-safe dummy values — no real secrets
    env:
      APP_ENV: testing
      POSTGRES_PASSWORD: test_password_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: compliance_test
      POSTGRES_USER: test_user
      JWT_SECRET_KEY: ci_test_jwt_secret_key_must_be_long_enough_to_pass_validation
      OPENAI_API_KEY: sk-test-placeholder
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -m "unit" \
            --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ============================================================
  # Frontend — Lint
  # ============================================================
  frontend-lint:
    name: "Frontend — Lint (ESLint)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Run ESLint
        run: npm run lint

  # ============================================================
  # Frontend — Build
  # ============================================================
  frontend-build:
    name: "Frontend — Build (Vite)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
